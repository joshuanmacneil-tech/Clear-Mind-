name = "clear-mind-openai-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"

[ai]
binding = "AI"

[vars]
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
ALLOWED_ORIGINS = "https://joshuanmacneil-tech.github.io"
MAX_REQUEST_BYTES = "65536"
MAX_HISTORY_MESSAGES = "10"
MAX_MESSAGE_CHARS = "3000"
MAX_THOUGHT_CHARS = "8000"

# Workers native rate limiting binding. The counter is best-effort/local to a Cloudflare location,
# not a strict global quota. Change limit/period here to tune the free-tier abuse safeguard.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[observability.logs]
enabled = true
